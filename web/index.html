<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var tags = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en']
        var lang = 'en'
        for (var i = 0; i < tags.length; i++) {
          var tag = String(tags[i] || '').toLowerCase().replace('_', '-')
          if (tag === 'pt' || tag.indexOf('pt-') === 0) { lang = 'pt-BR'; break }
          if (tag === 'en' || tag.indexOf('en-') === 0) { lang = 'en'; break }
        }
        document.documentElement.lang = lang
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Create posts for Instagram, LinkedIn, and more in the AWS Builder Center look."
    />

    <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico">
    <link rel="android-chrome" sizes="512x512" href="/favicon/android-chrome-512x512.png">
    <link rel="android-chrome" sizes="192x192" href="/favicon/android-chrome-192x192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">

    <title>Builder Tool</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
